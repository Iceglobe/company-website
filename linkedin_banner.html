<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniaOps LinkedIn Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-dark: #0a0e1a;
            --tagline-color: rgba(255, 255, 255, 0.7);
        }
        
        body, html {
            margin: 0;
            padding: 0;
            background: #000;
        }

        /* The exact LinkedIn dimension */
        .banner {
            width: 1128px;
            height: 192px;
            background: var(--navy-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(28, 45, 92, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(20, 30, 70, 0.4) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Subtle Grid Background */
        .banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.5;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 12px;
            z-index: 10;
        }

        .logo-omnia { color: #ffffff; }
        .logo-ops { color: rgba(255, 255, 255, 0.3); }

        .tagline {
            font-size: 14px;
            color: var(--tagline-color);
            letter-spacing: 0.02em;
            font-weight: 400;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .accent {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }
    </style>
</head>
<body>

    <div class="banner">
        <div class="logo">
            <span class="logo-omnia">Omnia</span><span class="logo-ops">Ops</span>
        </div>
        <div class="tagline">
            Helping companies raise their supply chain planning leveraging AI
        </div>
        <div class="accent"></div>
    </div>

</body>
</html>
